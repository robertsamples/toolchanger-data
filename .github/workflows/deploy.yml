name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Regenerate the diagrams and snippets so the published site can never
      # drift from data/, whatever is committed.
      - run: node tools/build-docs.mjs

      - name: Note if the committed output was stale
        run: |
          if ! git diff --quiet -- docs/assets/diagrams snippets; then
            echo "::warning::generated files changed during the build — run 'node tools/build-docs.mjs' and commit the result"
          fi

      - run: zensical build

      # Only needed if the site is ever served from a branch instead of an
      # artifact, but it costs nothing and stops Jekyll eating underscore paths.
      - run: touch site/.nojekyll

      # enablement turns Pages on via the API if it is off, so a fresh clone of
      # this repo does not need the settings toggle first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
