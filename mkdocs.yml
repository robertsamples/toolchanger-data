site_name: Toolchanger data
site_description: A reference for 3D printer toolchanger topologies

site_url: https://toolchangers.baconmilkshake.com/

# puts the repo link and icon in the header
repo_url: https://github.com/robertsamples/toolchanger-data
repo_name: robertsamples/toolchanger-data

docs_dir: docs
site_dir: site

# snippets/ lives outside docs_dir, so `mkdocs serve` would not otherwise
# notice when tools/build-docs.mjs regenerates it.
watch:
  - snippets

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - toc.follow

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/robertsamples/toolchanger-data
      name: Source on GitHub

extra_css:
  - stylesheets/plate.css

# One page per subtype, grouped by class. The plate on the front page links
# straight into these, so the labels here should match data/toolhead-taxonomy.json.
nav:
  - Toolchanger Classes: index.md
  - Conventional toolchangers:
      - Full conventional: subtypes/full-conventional.md
      - Partial conventional: subtypes/partial-conventional.md
  - Filament path changers:
      - Gear swapping path changers: subtypes/gear-swapping.md
      - Hotend fan swapping path changers: subtypes/hotend-fan-swapping.md
      - Inductive / pogo path changers: subtypes/inductive-pogo.md
      - Wired path changers: subtypes/wired.md
      - Drivetrain design: subtypes/drivetrain-design.md
      - IP Landscape: ip-landscape.md
  - Hotend changers:
      - AMS-assisted hotend changers: subtypes/ams-assisted-hotend-changer.md
      - AMS-assisted nozzle changers: subtypes/ams-assisted-nozzle-changer.md
  - All systems: all-systems.md
